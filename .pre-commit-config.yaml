# Checks that run on `git commit`, before anything leaves this machine. Once per clone:
#   uv tool install pre-commit && pre-commit install
# CI runs the same checks, so a clone without the hook still gets caught at the PR.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1  # keep in step with GITLEAKS_VERSION in .github/workflows/ci.yml
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # keep in step with RUFF_VERSION in .github/workflows/ci.yml
    hooks:
      - id: ruff-check
